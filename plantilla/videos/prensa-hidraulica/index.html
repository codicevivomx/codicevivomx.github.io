      :root {

      }
      @font-face {
        font-family: "Emoji";
        src: local("Segoe UI Emoji"), local("Noto Color Emoji"), local("Apple Color Emoji");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--fondo);
      }
      #root {
        width: 100%;
        height: 100%;
        background: var(--fondo);
        font-family: "Inter", "Emoji", sans-serif;
        color: var(--tinta);
      }
    </style>
