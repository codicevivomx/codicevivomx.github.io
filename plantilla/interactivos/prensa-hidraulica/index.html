<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Prensa hidráulica</title>
  <link rel="stylesheet" href="../../codice/codice.css">
  <link rel="stylesheet" href="estilos.css">
  <script type="module" src="prensa.js"></script>
</head>
<body>
  <main class="pagina lab" id="lab">
    <header class="encabezado">
      <h1 id="titulo"></h1>
      <p id="subtitulo"></p>
    </header>

    <figure class="lamina figura">
      <div class="lamina-marco">
        <div class="lienzo">
          <svg id="prensa" viewBox="0 0 320 296" role="img"></svg>
          <div class="arrastre solo-pantalla" id="zona"></div>
        </div>
      </div>
      <figcaption class="pie-lamina" id="pie"></figcaption>
    </figure>

    <section class="controles solo-pantalla">
      <label class="deslizador">
        <span class="deslizador-etq"><span id="etqD1"></span> <output id="outD1"></output></span>
        <input type="range" id="d1">
      </label>
      <label class="deslizador">
        <span class="deslizador-etq"><span id="etqD2"></span> <output id="outD2"></output></span>
        <input type="range" id="d2">
      </label>
      <label class="deslizador">
        <span class="deslizador-etq"><span id="etqX"></span> <output id="outX"></output></span>
        <input type="range" id="x">
      </label>
    </section>

    <section class="lecturas" aria-live="polite">
      <div class="dato">
        <span class="etq"><span class="numeral" id="num1"></span><span id="etqRd"></span></span>
        <strong class="valor" id="valRd"></strong>
      </div>
      <div class="dato">
        <span class="etq"><span class="numeral" id="num2"></span><span id="etqRa"></span></span>
        <strong class="valor" id="valRa"></strong>
      </div>
      <div class="dato">
        <span class="etq"><span class="numeral" id="num3"></span><span id="etqF2"></span></span>
        <strong class="valor grande" id="valF2"></strong>
        <p class="trampa" id="trampa"></p>
      </div>
      <div class="dato">
        <span class="etq"><span class="numeral" id="num4"></span><span id="etqY"></span></span>
        <strong class="valor" id="valY"></strong>
      </div>
      <div class="dato">
        <span class="etq"><span class="numeral" id="num5"></span><span id="etqW"></span></span>
        <p class="valor" id="valW1"></p>
        <p class="valor" id="valW2"></p>
        <p class="mensaje" id="mensaje"></p>
      </div>
    </section>

    <section class="prueba">
      <h2 class="titulo-seccion" id="pruebaTitulo"></h2>
      <p id="pregunta"></p>
      <div class="opciones" id="opciones"></div>
      <p class="retro" id="retro" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
