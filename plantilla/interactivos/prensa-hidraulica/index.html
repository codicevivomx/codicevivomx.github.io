<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prensa hidráulica</title>
  <link rel="stylesheet" href="estilos.css">
  <script type="module" src="prensa.js"></script>
</head>
<body>
  <main class="lab" id="lab">
    <header class="cabecera">
      <h1 id="titulo"></h1>
      <p id="subtitulo"></p>
    </header>

    <section class="tarjeta figura">
      <svg id="prensa" viewBox="0 0 320 292" role="img"></svg>
      <p class="pista" id="instruccion"></p>
      <div class="controles">
        <label class="control">
          <span><span id="etqD1"></span> <output id="outD1"></output></span>
          <input type="range" id="d1">
        </label>
        <label class="control">
          <span><span id="etqD2"></span> <output id="outD2"></output></span>
          <input type="range" id="d2">
        </label>
        <label class="control">
          <span><span id="etqX"></span> <output id="outX"></output></span>
          <input type="range" id="x">
        </label>
      </div>
    </section>

    <section class="tarjeta lecturas" aria-live="polite">
      <div class="dato">
        <span class="etq" id="etqRd"></span>
        <strong class="valor" id="valRd"></strong>
      </div>
      <div class="dato">
        <span class="etq" id="etqRa"></span>
        <strong class="valor" id="valRa"></strong>
      </div>
      <div class="dato">
        <span class="etq" id="etqF2"></span>
        <strong class="valor grande" id="valF2"></strong>
        <p class="trampa" id="trampa"></p>
      </div>
      <div class="dato">
        <span class="etq" id="etqY"></span>
        <strong class="valor" id="valY"></strong>
      </div>
      <div class="dato">
        <span class="etq" id="etqW"></span>
        <p class="valor" id="valW1"></p>
        <p class="valor" id="valW2"></p>
        <p class="mensaje" id="mensaje"></p>
      </div>
    </section>

    <section class="tarjeta prueba">
      <h2 id="pruebaTitulo"></h2>
      <p id="pregunta"></p>
      <div class="opciones" id="opciones"></div>
      <p class="retro" id="retro" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
