<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Principio de Arquímedes · Códice Vivo</title>
  <link rel="stylesheet" href="../../codice/codice.css">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="pagina">
    <header class="encabezado">
      <h1 id="titulo">Principio de Arquímedes</h1>
      <p id="subtitulo">Física · Examen de admisión UNAM</p>
    </header>

    <div class="contenido">
      <div id="pasos-a" class="pasos"></div>

      <figure class="lamina bloque-lamina" id="lamina-arquimedes">
        <div class="lamina-marco">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="arq-titulo arq-desc">
  <title id="arq-titulo">Principio de Arquímedes</title>
  <desc id="arq-desc">Un cubo de aluminio colgado de un dinamómetro marca 26.5 N fuera del agua y 16.7 N sumergido. El empuje, 9.8 N, es el peso del agua desalojada, que cae del vaso de derrame al vaso recolector.</desc>
  <defs>
    <pattern id="rayado-solido" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line class="g-rayado-tinta" x1="0" y1="0" x2="0" y2="7"/>
    </pattern>
    <pattern id="rayado-agua" width="14" height="8" patternUnits="userSpaceOnUse">
      <line class="g-rayado-agua" x1="1" y1="4" x2="9" y2="4"/>
    </pattern>
  </defs>

  <!-- Soporte fijo -->
  <rect class="g-solido" stroke-width="2" x="120" y="28" width="480" height="12"/>
  <rect fill="url(#rayado-solido)" x="120" y="28" width="480" height="12"/>

  <!-- Dinamómetro fuera del agua: 0 N en y=65, 4 px por N, marca 26.5 N -->
  <g id="dinamometro-fuera">
    <line class="g-tinta" stroke-width="1.5" x1="180" y1="40" x2="180" y2="44"/>
    <circle class="g-tinta" stroke-width="1.5" cx="180" cy="47" r="3"/>
    <rect class="g-solido" stroke-width="2.5" x="160" y="50" width="40" height="160" rx="6"/>
    <path class="g-tinta" stroke-width="1.2" d="M160 65h10M160 75h6M160 85h10M160 95h6M160 105h10M160 115h6M160 125h10M160 135h6M160 145h10M160 155h6M160 165h10M160 175h6M160 185h10"/>
    <text class="g-rotulo escala" x="154" y="70" text-anchor="end">0</text>
    <text class="g-rotulo escala" x="154" y="110" text-anchor="end">10</text>
    <text class="g-rotulo escala" x="154" y="150" text-anchor="end">20</text>
    <text class="g-rotulo escala" x="154" y="190" text-anchor="end">30</text>
    <polyline class="g-tinta" stroke-width="1.5" points="180,56 172,65.2 188,74.3 172,83.5 188,92.7 172,101.8 188,111 172,120.2 188,129.3 172,138.5 188,147.7 172,156.8 180,166"/>
    <line class="g-tinta" stroke-width="2.5" x1="180" y1="171" x2="180" y2="254"/>
    <polygon class="g-relleno-enfasis" points="162,171 172,166 196,166 196,176 172,176"/>
    <text class="g-rotulo enfasis" x="208" y="179">26.5 N</text>
    <circle class="g-tinta" stroke-width="2.5" cx="180" cy="259" r="5"/>
    <line class="g-tinta" stroke-width="1.5" x1="180" y1="264" x2="180" y2="295"/>
    <rect class="g-solido" stroke="none" x="140" y="295" width="80" height="80"/>
    <rect fill="url(#rayado-solido)" x="140" y="295" width="80" height="80"/>
    <rect class="g-tinta" stroke-width="2.5" x="140" y="295" width="80" height="80"/>
  </g>

  <!-- Cubo de aluminio con su hilo (estado dibujado: sumergido por completo) -->
  <g id="cubo">
    <line class="g-tinta" stroke-width="1.5" x1="540" y1="374.8" x2="540" y2="405.8"/>
    <rect class="g-solido" stroke="none" x="500" y="405.8" width="80" height="80"/>
    <rect fill="url(#rayado-solido)" x="500" y="405.8" width="80" height="80"/>
    <rect class="g-tinta" stroke-width="2.5" x="500" y="405.8" width="80" height="80"/>
  </g>

  <!-- Agua del vaso de derrame: llega justo al pico (y=375) -->
  <g id="agua">
    <rect class="g-fluido" x="441.5" y="375" width="197" height="178.5"/>
    <rect fill="url(#rayado-agua)" x="441.5" y="375" width="197" height="178.5"/>
    <line class="g-rayado-agua" style="stroke-width:1.5" x1="442" y1="375" x2="638" y2="375"/>
  </g>

  <!-- Vaso de derrame con pico -->
  <g id="vaso-derrame">
    <path class="g-tinta" stroke-width="2.5" d="M440 345V555H640V375L690 392"/>
    <path class="g-tinta" stroke-width="2.5" d="M640 345V362L690 380"/>
  </g>

  <!-- Peso (escala común: 3.5 px por N) -->
  <g id="flecha-peso">
    <line class="g-tinta" stroke-width="3" x1="552" y1="445.8" x2="552" y2="526.4"/>
    <polygon class="g-relleno-tinta" points="552,538.4 545,526.4 559,526.4"/>
    <text class="g-rotulo" x="562" y="534">P</text>
  </g>

  <!-- Empuje (escala común: 3.5 px por N) -->
  <g id="flecha-empuje">
    <line class="g-enfasis" stroke-width="3" x1="528" y1="445.8" x2="528" y2="423.5"/>
    <polygon class="g-relleno-enfasis" points="528,411.5 521,423.5 535,423.5"/>
    <text class="g-rotulo enfasis" x="516" y="419.5" text-anchor="end">E</text>
  </g>

  <!-- Agua desalojada: chorro + agua en el recolector (misma área que el cubo) -->
  <g id="agua-desplazada">
    <path class="g-rayado-agua" style="stroke-width:4;stroke-linecap:round;fill:none" d="M690 392Q712 410 712 440V479"/>
    <rect class="g-fluido" x="671.5" y="479" width="87" height="74.5"/>
    <rect fill="url(#rayado-agua)" x="671.5" y="479" width="87" height="74.5"/>
  </g>

  <!-- Vaso recolector -->
  <g id="vaso-recolector">
    <path class="g-tinta" stroke-width="2.5" d="M664 460H670V555H760V460H766"/>
  </g>

  <!-- Dinamómetro dentro del agua: 0 N en y=215, 4 px por N, marca 16.7 N -->
  <g id="dinamometro-dentro">
    <line id="dinamometro-dentro-cordon" class="g-tinta" stroke-width="1.5" x1="540" y1="40" x2="540" y2="194"/>
    <circle class="g-tinta" stroke-width="1.5" cx="540" cy="197" r="3"/>
    <rect class="g-solido" stroke-width="2.5" x="520" y="200" width="40" height="160" rx="6"/>
    <path class="g-tinta" stroke-width="1.2" d="M520 215h10M520 225h6M520 235h10M520 245h6M520 255h10M520 265h6M520 275h10M520 285h6M520 295h10M520 305h6M520 315h10M520 325h6M520 335h10"/>
    <text class="g-rotulo escala" x="514" y="220" text-anchor="end">0</text>
    <text class="g-rotulo escala" x="514" y="260" text-anchor="end">10</text>
    <text class="g-rotulo escala" x="514" y="300" text-anchor="end">20</text>
    <text class="g-rotulo escala" x="514" y="340" text-anchor="end">30</text>
    <g id="dinamometro-dentro-resorte">
      <polyline class="g-tinta" stroke-width="1.5" points="540,206 532,211.9 548,217.8 532,223.7 548,229.6 532,235.5 548,241.4 532,247.3 548,253.2 532,259.1 548,265 532,270.9 540,276.8"/>
    </g>
    <g id="dinamometro-dentro-indicador">
      <line class="g-tinta" stroke-width="2.5" x1="540" y1="281.8" x2="540" y2="364.8"/>
      <polygon class="g-relleno-enfasis" points="522,281.8 532,276.8 556,276.8 556,286.8 532,286.8"/>
      <text class="g-rotulo enfasis" x="568" y="289.8">16.7 N</text>
      <circle class="g-tinta" stroke-width="2.5" cx="540" cy="369.8" r="5"/>
    </g>
  </g>

  <!-- Rótulos fijos -->
  <text class="g-rotulo suave" x="180" y="410" text-anchor="middle">Fuera del agua</text>
  <text class="g-rotulo suave" x="540" y="585" text-anchor="middle">Dentro del agua</text>
  <text class="g-rotulo suave" x="715" y="585" text-anchor="middle">agua desalojada</text>
</svg>

        </div>
        <figcaption class="pie-lamina" id="pie-lamina">Lámina I. El empuje y el dinamómetro. Baja el cubo con el deslizador.</figcaption>
      </figure>

      <section class="controles solo-pantalla" aria-label="Controles de la lámina">
        <div class="deslizador">
          <div class="deslizador-etq">
            <label for="bajar">Bajar el cubo</label>
            <span>Sumergido: <output id="sumergido" for="bajar">0 %</output></span>
          </div>
          <input type="range" id="bajar" min="0" max="1000" step="1" value="0">
        </div>
        <div class="calculos numeros">
          <p><span class="numeral">I.</span> V<sub>sumergido</sub> = <output id="c-vol">0.0000</output> m<sup>3</sup></p>
          <p><span class="numeral">II.</span> E = 1&nbsp;000 · 9.8 · V<sub>sumergido</sub> = <output id="c-emp">0.0</output> N</p>
          <p><span class="numeral">III.</span> P = 2&nbsp;700 · 9.8 · 0.001 = 26.5 N</p>
          <p><span class="numeral">IV.</span> Marca = P − E = <output id="c-marca">26.5</output> N</p>
          <p class="suave" id="c-nota" aria-live="polite"></p>
        </div>
        <button type="button" class="boton" id="reiniciar">Reiniciar</button>
      </section>

      <div id="pasos-b" class="pasos"></div>
    </div>
  </main>
  <script src="principio-de-arquimedes.js" defer></script>
</body>
</html>
